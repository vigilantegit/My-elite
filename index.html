<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elite</title>
<meta name="theme-color" content="#090b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elite">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>
:root{--bg:#f6f3ec;--panel:#fffdf8;--line:#e3dccb;--tx:#1a1710;--mute:#7a7261;--up:#0d8f6b;--dn:#c93a4f;--ac:#b8892b;--acx:#fffdf8;--in:#efe9db}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090b12;--panel:#10141f;--line:#222838;--tx:#ece8dc;--mute:#8d90a0;--up:#34d3a0;--dn:#ff6b7f;--ac:#d9b25f;--acx:#14110a;--in:#171c2a}}
:root[data-theme="dark"]{--bg:#090b12;--panel:#10141f;--line:#222838;--tx:#ece8dc;--mute:#8d90a0;--up:#34d3a0;--dn:#ff6b7f;--ac:#d9b25f;--acx:#14110a;--in:#171c2a}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Instrument Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 14px;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;color:var(--ac)}.logo svg{width:22px;height:22px}.live{display:flex;align-items:center;gap:8px;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;background:var(--panel)}.live b{font-weight:600}.dot{width:8px;height:8px;border-radius:50%;background:var(--up);animation:pl 1.6s infinite}@keyframes pl{50%{box-shadow:0 0 0 5px transparent;opacity:.5}0%{box-shadow:0 0 0 0 var(--up)}}.fl{animation:fl .5s}@keyframes fl{from{background:var(--in)}}
nav{display:flex;gap:4px;background:var(--in);padding:3px;border-radius:9px}
nav button{border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:6px 14px;border-radius:7px;cursor:pointer}
nav button.on{background:var(--ac);color:var(--acx)}
.sp{flex:1}.tag{font-size:12px;color:var(--mute)}
main{padding:14px;max-width:1200px;margin:auto}
section{display:none}section.on{display:block}
.g{display:grid;gap:12px}
.trade{grid-template-columns:1fr}
@media(min-width:900px){.trade{grid-template-columns:1fr 230px 280px}.c2{grid-template-columns:2fr 1fr}.c4{grid-template-columns:repeat(4,1fr)}}
.c4{grid-template-columns:repeat(2,1fr)}
.p{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
h2{font-size:13px;margin:0 0 10px;color:var(--mute);font-weight:600}
.big{font-size:26px;font-weight:700;letter-spacing:-.5px}
.up{color:var(--up)}.dn{color:var(--dn)}
.ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ph b{font-size:17px}
.tf{display:flex;gap:4px;margin-left:auto}.tf button{border:1px solid var(--line);background:none;color:var(--mute);border-radius:6px;padding:3px 8px;font:inherit;cursor:pointer}.tf .on{color:var(--tx);border-color:var(--ac)}
svg{display:block;width:100%;height:auto}
.ob div{display:flex;justify-content:space-between;padding:2px 0;position:relative;font-size:13px}
.ob div span:last-child{color:var(--mute)}
.ob .bar{position:absolute;right:0;top:0;bottom:0;opacity:.14;z-index:0}
.ob span{position:relative;z-index:1}
.mid{text-align:center;font-weight:700;padding:8px 0;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--in);padding:3px;border-radius:9px;margin-bottom:10px}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-weight:700;padding:8px;border-radius:7px;cursor:pointer}
.seg .buy.on{background:var(--up);color:#04130f}.seg .sell.on{background:var(--dn);color:#fff}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=tel],select{width:100%;background:var(--in);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 10px;font:inherit}
input:focus,button:focus-visible,select:focus{outline:2px solid var(--ac);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--ac)}
.cta{width:100%;margin-top:12px;border:0;border-radius:9px;padding:12px;font:inherit;font-weight:700;cursor:pointer;color:#04130f;background:var(--up)}
.cta.sell{background:var(--dn);color:#fff}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:8px}.row b{color:var(--tx);font-weight:500}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:460px}
th{text-align:left;color:var(--mute);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border:0}
.bdg{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--in)}
.bdg.ok{color:var(--up)}.bdg.warn{color:var(--ac)}.bdg.bad{color:var(--dn)}
.stat small{color:var(--mute);display:block;margin-bottom:2px}
.stat b{font-size:20px}
.alloc{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0 10px}
.lg{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border:0}.sw small{color:var(--mute);display:block}
.tg{width:40px;height:22px;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--up)}.tg.on::after{left:21px}
.mini{border:1px solid var(--line);background:none;color:var(--tx);border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}
.mth{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}.mth button{border:1px solid var(--line);background:var(--in);color:var(--tx);border-radius:10px;padding:12px 6px;font:inherit;font-weight:600;cursor:pointer;text-align:center}.mth button small{display:block;font-weight:400;color:var(--mute);font-size:11px}.mth .on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.st{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--in);font-size:13px;display:none}.st.show{display:block}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:9px;opacity:0;transition:.2s;pointer-events:none;z-index:9;font-weight:600}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){input[type=text],input[type=number],input[type=email],input[type=password],input[type=tel],select{font-size:16px}main{padding:10px}.mini{padding:8px 12px}nav button{padding:8px 12px}.cta{padding:14px}}
@media(max-width:899px){.trade>:nth-child(3){order:2}.trade>:nth-child(2){order:3}}
.seg.gold .buy.on{background:var(--ac);color:var(--acx)}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:var(--in);padding:8px 10px;border-radius:8px;margin:8px 0;user-select:all}.flag{color:var(--ac)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.notice{border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--panel));padding:12px 14px;border-radius:10px;margin:0 0 12px}
.notice strong{display:block;margin-bottom:3px}.notice p{margin:0;color:var(--mute);font-size:13px}
.who{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--in);font-size:13px}
.hint button{margin-left:6px}
.empty{color:var(--mute);padding:14px 0}
@media(max-width:700px){header{gap:8px}nav{max-width:100%;overflow-x:auto}nav button{white-space:nowrap}.who{display:none}}
.dgpx{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.dgl{color:var(--ac);border-bottom:2px solid var(--ac)}
.dgs{display:flex;gap:4px;flex-wrap:wrap}.dgc{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--in)}
.dgc.u{color:var(--up)}.dgc.d{color:var(--dn)}
.dgbars{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:12px}
.dgb{background:none;border:1px solid transparent;border-radius:8px;padding:4px 0;color:var(--tx);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.dgb.sel{border-color:var(--ac);background:var(--in)}
.dgb .pct{font-style:normal;font-size:11px;color:var(--mute)}.dgb .col{height:110px;width:70%;display:flex;align-items:flex-end;background:var(--in);border-radius:5px;overflow:hidden}
.dgb u{display:block;width:100%;background:var(--mute);text-decoration:none}.dgb.hi u{background:var(--up)}.dgb.lo u{background:var(--dn)}
